<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cookieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="britBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cookieGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Outer Wrapper -->
  <rect x="10" y="10" width="580" height="780" rx="16" fill="url(#cookieBg)" stroke="#f59e0b" stroke-width="2"/>

  <!-- Brand Banner -->
  <rect x="10" y="10" width="580" height="120" rx="16" fill="url(#britBlue)"/>
  <rect x="230" y="25" width="140" height="35" rx="6" fill="#dc2626"/>
  <text x="300" y="49" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">BRITANNIA</text>

  <text x="300" y="100" font-family="'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="44" fill="#fef08a" text-anchor="middle">Good Day</text>

  <!-- Subheading -->
  <rect x="120" y="145" width="360" height="40" rx="20" fill="url(#cookieGold)"/>
  <text x="300" y="172" font-family="Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">CASHEW COOKIES</text>

  <!-- Realistic Cookie Graphic -->
  <g transform="translate(210, 205)">
    <circle cx="90" cy="80" r="70" fill="#d97706" stroke="#b45309" stroke-width="3"/>
    <circle cx="90" cy="80" r="60" fill="#f59e0b"/>
    <!-- Cashew bits -->
    <ellipse cx="65" cy="60" rx="14" ry="8" fill="#fef3c7" transform="rotate(-20, 65, 60)"/>
    <ellipse cx="115" cy="70" rx="16" ry="9" fill="#fef3c7" transform="rotate(30, 115, 70)"/>
    <ellipse cx="85" cy="105" rx="15" ry="8" fill="#fef3c7" transform="rotate(5, 85, 105)"/>
    <!-- Smile lines -->
    <path d="M 50 85 Q 90 125 130 85" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Legal Metrology Mandated Panel -->
  <rect x="35" y="385" width="530" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="35" y="385" width="530" height="34" rx="12" fill="#f8fafc"/>
  <text x="50" y="408" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#334155" letter-spacing="1">MANDATORY PRODUCT DECLARATIONS (PACKAGED COMMODITIES RULES)</text>

  <!-- FSSAI Block & Veg Mark -->
  <rect x="50" y="430" width="230" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="65" y="445" width="28" height="28" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="79" cy="459" r="6" fill="#16a34a"/>
  <text x="105" y="455" font-family="Arial, sans-serif" font-weight="900" font-size="17" fill="#15803d">fssai</text>
  <text x="105" y="475" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#166534">Lic. No. 10015043001129</text>

  <!-- Net Weight & MRP -->
  <rect x="295" y="430" width="255" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="310" y="454" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="#1e3a8a">NET WEIGHT: 200 g</text>
  <text x="310" y="476" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#b91c1c">MRP: ₹ 45.00 <tspan font-weight="500" font-size="10" fill="#64748b">(₹0.225 / g, incl. all taxes)</tspan></text>

  <!-- Mfg & Expiry Dates -->
  <rect x="50" y="505" width="500" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="65" y="527" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">DATE OF PACKAGING (MFD): <tspan font-weight="900" fill="#2563eb">01/09/2026</tspan></text>
  <text x="65" y="546" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">EXPIRY / BEST BEFORE: <tspan font-weight="900" fill="#16a34a">01/03/2027</tspan> (BEST BEFORE 6 MONTHS)</text>

  <!-- Manufacturer Address -->
  <text x="50" y="580" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#0f172a">MANUFACTURED &amp; MARKETED BY:</text>
  <text x="50" y="597" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#334155">Britannia Industries Limited</text>
  <text x="50" y="613" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b">5/1A, Hungerford Street, Kolkata - 700017, West Bengal. Made in India.</text>

  <!-- Consumer Care Service -->
  <rect x="50" y="630" width="500" height="42" rx="6" fill="#f1f5f9"/>
  <text x="65" y="647" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#1e293b">CONSUMER CARE EXECUTIVE:</text>
  <text x="65" y="663" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#2563eb">Toll Free: 1800-425-4449 • Email: feedback@britindia.com</text>

  <!-- Barcode Simulation -->
  <g transform="translate(190, 688)">
    <rect x="0" y="0" width="220" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="12" y1="5" x2="12" y2="35" stroke="#000" stroke-width="2.5"/>
    <line x1="18" y1="5" x2="18" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="25" y1="5" x2="25" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="35" y1="5" x2="35" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="48" y1="5" x2="48" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="60" y1="5" x2="60" y2="35" stroke="#000" stroke-width="1.5"/>
    <line x1="70" y1="5" x2="70" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="82" y1="5" x2="82" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="95" y1="5" x2="95" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="110" y1="5" x2="110" y2="35" stroke="#000" stroke-width="1.5"/>
    <line x1="120" y1="5" x2="120" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="135" y1="5" x2="135" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="5" x2="150" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="165" y1="5" x2="165" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="180" y1="5" x2="180" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="195" y1="5" x2="195" y2="35" stroke="#000" stroke-width="1.5"/>
    <text x="110" y="55" font-family="Courier, monospace" font-size="11" fill="#334155" text-anchor="middle">8 901063 012441</text>
  </g>
</svg>
