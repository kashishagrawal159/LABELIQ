<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="pharmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="stripHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Foil Blister Packaging Background -->
  <rect x="10" y="10" width="580" height="780" rx="16" fill="url(#pharmaBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="10" y="10" width="580" height="110" rx="16" fill="url(#stripHeader)"/>
  
  <!-- Rx Symbol & Header -->
  <text x="50" y="65" font-family="'Times New Roman', serif" font-weight="900" font-size="46" fill="#fef08a">℞</text>
  <text x="110" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff">PARACETAMOL TABLETS IP</text>
  <text x="110" y="85" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#ccfbf1">500 mg</text>
  <text x="530" y="65" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="end">10 TABLETS</text>

  <!-- Composition & Dosage Info Box -->
  <rect x="40" y="135" width="520" height="95" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="55" y="160" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#0f172a">COMPOSITION:</text>
  <text x="55" y="180" font-family="Arial, sans-serif" font-weight="500" font-size="12" fill="#334155">Each uncoated tablet contains: Paracetamol IP 500 mg. Excipients q.s.</text>
  <text x="55" y="200" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#475569">Dosage: As directed by the Physician. Store below 30°C in a dry place. Keep out of reach of children.</text>
  <text x="55" y="218" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#dc2626">SCHEDULE H PRESCRIPTION DRUG — CAUTION: Not to be sold by retail without prescription.</text>

  <!-- Realistic Blister Pockets Visualization -->
  <g transform="translate(60, 245)">
    <!-- 10 Tablets Simulation -->
    <rect x="0" y="0" width="480" height="110" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Row 1: 5 tablets -->
    <circle cx="50" cy="32" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="140" cy="32" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="230" cy="32" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="320" cy="32" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="410" cy="32" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Row 2: 5 tablets -->
    <circle cx="50" cy="80" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="140" cy="80" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="230" cy="80" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="320" cy="80" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="410" cy="80" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Statutory Legal Metrology & Drugs Act Declarations Panel -->
  <rect x="40" y="375" width="520" height="390" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>

  <!-- Panel Header -->
  <rect x="40" y="375" width="520" height="34" rx="12" fill="#f8fafc"/>
  <text x="55" y="398" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f766e" letter-spacing="1">CDSCO &amp; LEGAL METROLOGY MANDATORY DECLARATIONS</text>

  <!-- Drug License & Batch Details -->
  <rect x="55" y="420" width="240" height="65" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="68" y="443" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f766e">MFG. LIC. NO:</text>
  <text x="68" y="460" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#134e4a">M/748/2016</text>
  <text x="68" y="476" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#0d9488">BATCH NO: B.No. T-5028</text>

  <!-- Net Quantity & MRP -->
  <rect x="310" y="420" width="235" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="325" y="443" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#1e3a8a">NET QTY: 10 TABLETS</text>
  <text x="325" y="465" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#dc2626">M.R.P. ₹ 20.00</text>
  <text x="325" y="478" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b">(₹2.00 / Tablet, incl. all taxes)</text>

  <!-- Dates Stamp (MFG & EXPIRY) -->
  <rect x="55" y="495" width="490" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="518" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">MFG. DATE: <tspan font-weight="900" fill="#0f766e">06/2026</tspan></text>
  <text x="70" y="536" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#1e293b">EXPIRY DATE: <tspan font-weight="900" fill="#059669">05/2028</tspan> (VALID • 24 MONTHS SHELF LIFE)</text>

  <!-- Pharmaceutical Manufacturer Address -->
  <text x="55" y="575" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#0f172a">MANUFACTURED IN INDIA BY:</text>
  <text x="55" y="593" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#0f766e">Demo Pharma Labs Pvt. Ltd.</text>
  <text x="55" y="610" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#334155">Plot No. 104, Industrial Area Phase-II, Chandigarh - 160002, India.</text>
  <text x="55" y="625" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b">Country of Origin: India. Domestic Commodity.</text>

  <!-- Consumer Care Service -->
  <rect x="55" y="640" width="490" height="42" rx="6" fill="#f1f5f9"/>
  <text x="70" y="657" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#1e293b">DRUG INFORMATION &amp; CONSUMER CARE:</text>
  <text x="70" y="672" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#0f766e">Phone: 1800-000-0000 (Toll Free) • Email: druginfo@demopharma.in</text>

  <!-- GS1 Datamatrix / Barcode Simulation -->
  <g transform="translate(200, 698)">
    <rect x="0" y="0" width="200" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="10" y1="5" x2="10" y2="35" stroke="#000" stroke-width="2.5"/>
    <line x1="20" y1="5" x2="20" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="32" y1="5" x2="32" y2="35" stroke="#000" stroke-width="1.5"/>
    <line x1="45" y1="5" x2="45" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="60" y1="5" x2="60" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="75" y1="5" x2="75" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="90" y1="5" x2="90" y2="35" stroke="#000" stroke-width="1.5"/>
    <line x1="105" y1="5" x2="105" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="120" y1="5" x2="120" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="135" y1="5" x2="135" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="150" y1="5" x2="150" y2="35" stroke="#000" stroke-width="1.5"/>
    <line x1="165" y1="5" x2="165" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="180" y1="5" x2="180" y2="35" stroke="#000" stroke-width="2.5"/>
    <text x="100" y="55" font-family="Courier, monospace" font-size="11" fill="#334155" text-anchor="middle">8 904001 050284</text>
  </g>
</svg>
